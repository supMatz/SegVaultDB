<!doctype html>
<!--
  Web app d'esempio: registro spese salvato in SegVault.
  Avvio:   ./segvault-server --static examples/web
  Poi apri http://127.0.0.1:8484/  (pagina e API sulla stessa origine: niente CORS)
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spese · SegVault</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<script>
  document.documentElement.dataset.bsTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
</script>
<style>
  body { background: var(--bs-tertiary-bg); }
  main.container { max-width: 860px; }
  .table { font-variant-numeric: tabular-nums; }
  #err { min-height: 1.5em; }
</style>
</head>
<body>
<main class="container py-4">
  <h1 class="h4 mb-1">Registro spese</h1>
  <div class="text-body-secondary small">Dati salvati in SegVault tramite <code>POST /api/v1/query</code> con parametri <code>?</code>.</div>
  <div id="err" class="text-danger"></div>

  <section class="card card-body mt-3">
    <form id="add" class="row g-2">
      <div class="col-12 col-md-4">
        <input class="form-control" name="descrizione" placeholder="Descrizione" required maxlength="80">
      </div>
      <div class="col-6 col-md-2">
        <input class="form-control" name="importo" type="number" step="0.01" min="0.01" placeholder="Importo €" required>
      </div>
      <div class="col-6 col-md-2">
        <select class="form-select" name="categoria">
          <option>Casa</option><option>Cibo</option><option>Trasporti</option><option>Svago</option><option>Altro</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <input class="form-control" name="giorno" type="date" required>
      </div>
      <div class="col-6 col-md-2">
        <button class="btn btn-primary w-100">Aggiungi</button>
      </div>
    </form>
  </section>

  <section class="card card-body mt-3">
    <div><strong>Per categoria</strong> <span class="text-body-secondary small">(GROUP BY lato database)</span></div>
    <table id="cat" class="table table-sm align-middle mb-0">
      <thead><tr><th>Categoria</th><th class="text-end">Spese</th><th class="text-end">Totale</th><th style="width:40%"></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card card-body mt-3">
    <div><strong>Ultime spese</strong></div>
    <table id="list" class="table table-sm align-middle mb-0">
      <thead><tr><th>Giorno</th><th>Descrizione</th><th>Categoria</th><th class="text-end">Importo</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script type="module">
// client minimo (lo stesso di clients/segvault.js, ridotto)
async function sql(sql, params = [], opts = {}) {
  const res = await fetch("/api/v1/query", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params, database: "spese", rows: "objects", ...opts }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error.message);
  return data.results.at(-1)?.rows ?? [];
}

const euro = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const showError = (e) => { $("#err").textContent = e ? e.message : ""; };

async function setup() {
  // schema creato al primo avvio (database: null = nessun USE prima dello script)
  const dbs = await (await fetch("/api/v1/databases")).json();
  if (!dbs.databases.includes("spese")) {
    await sql(`CREATE DATABASE spese; USE spese;
               CREATE TABLE spesa (
                 id INT PRIMARY KEY AUTO_INCREMENT,
                 descrizione VARCHAR(80) NOT NULL,
                 importo FLOAT NOT NULL CHECK (importo > 0),
                 categoria VARCHAR(20) NOT NULL,
                 giorno DATE NOT NULL)`, [], { database: null, transaction: true });
  }
}

async function refresh() {
  const cats = await sql(`SELECT categoria, COUNT(*) AS n, SUM(importo) AS totale
                          FROM spesa GROUP BY categoria ORDER BY totale DESC`);
  const max = Math.max(1, ...cats.map((c) => c.totale));
  $("#cat tbody").innerHTML = cats.map((c) => `<tr><td>${esc(c.categoria)}</td><td class="text-end">${c.n}</td>
      <td class="text-end">${euro.format(c.totale)}</td>
      <td><div class="progress" style="height:8px"><div class="progress-bar" role="progressbar" style="width:${(100 * c.totale / max).toFixed(1)}%"></div></div></td></tr>`).join("");

  const rows = await sql("SELECT * FROM spesa ORDER BY giorno DESC, id DESC LIMIT ?", [50]);
  $("#list tbody").innerHTML = rows.map((r) => `<tr><td>${esc(r.giorno)}</td><td>${esc(r.descrizione)}</td>
      <td>${esc(r.categoria)}</td><td class="text-end">${euro.format(r.importo)}</td>
      <td><button class="btn btn-link btn-sm text-danger p-0" data-id="${r.id}" title="Elimina">✕</button></td></tr>`).join("");
}

$("#add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await sql("INSERT INTO spesa (descrizione, importo, categoria, giorno) VALUES (?, ?, ?, ?)",
              [f.get("descrizione"), Number(f.get("importo")), f.get("categoria"), f.get("giorno")]);
    ev.target.reset();
    ev.target.giorno.valueAsDate = new Date();
    showError(null);
    await refresh();
  } catch (e) { showError(e); }
});

$("#list").addEventListener("click", async (ev) => {
  const id = ev.target.dataset?.id;
  if (!id) return;
  try { await sql("DELETE FROM spesa WHERE id = ?", [Number(id)]); await refresh(); } catch (e) { showError(e); }
});

$("#add").giorno.valueAsDate = new Date();
setup().then(refresh).catch(showError);
</script>
</body>
</html>
