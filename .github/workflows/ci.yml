name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash   # -eo pipefail: un errore di make non viene nascosto da tee

permissions:
  contents: read   # nessun job scrive nel repository (CR-B7)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxft-dev libxrender-dev libfontconfig1-dev mingw-w64

      - name: Build (Linux)
        run: make -j"$(nproc)" 2>&1 | tee build.log

      - name: No compiler warnings (Linux)
        run: "! grep -E 'warning:' build.log"

      - name: Engine tests
        run: make test

      - name: Engine tests under AddressSanitizer + UBSan
        run: make test-asan

      - name: Build (Windows, MinGW-w64)
        run: make -j"$(nproc)" windows 2>&1 | tee build-win.log

      - name: No compiler warnings (Windows)
        run: "! grep -E 'warning:' build-win.log"

      - name: Windows-only code under wine (64-bit offsets, MoveFileEx, engine)
        run: |
          # wine 10 (Ubuntu 25.x): il pacchetto wine64 non porta più il comando "wine", che sta nel pacchetto wine
          sudo apt-get install -y --no-install-recommends wine64 wine || sudo apt-get install -y --no-install-recommends wine
          make test-win

      - name: Debug build compiles (-DDEBUG)
        run: gcc -std=c11 -D_GNU_SOURCE -DDEBUG -fsyntax-only -Iinclude -Isrc -Isrc/catalog -Isrc/storage -Isrc/table -Isrc/index -Isrc/query -Isrc/tx -Isrc/bridge src/tx/wal.c src/bridge/db_api.c src/query/executor.c

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segvault-windows
          path: |
            segvault.exe
            segvault-server.exe
            assets/

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential php-cgi
      - name: ThreadSanitizer (parallel reads, PHP, sessions, HTTP server, web)
        run: make test-tsan
      - name: Durability under AddressSanitizer + UBSan (fault injection, crash points)
        run: |
          make test_durability CFLAGS="-std=c11 -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          ./test_durability
      - name: HTTP/2 frames under AddressSanitizer
        run: |
          make test_h2 CFLAGS="-std=c11 -D_GNU_SOURCE -g -O1 -fsanitize=address,undefined"
          ./test_h2

  windows-native:
    runs-on: windows-latest
    continue-on-error: true          # nuovo: informativo finché non è stabile sui runner
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Windows-only code, natively (64-bit offsets, MoveFileEx, engine)
        run: make test-win WIN_CC=gcc WIN_RUN=
      - name: Build segvault-server.exe and segvault.exe natively
        run: make -j4 windows WIN_CC=gcc

  macos:
    runs-on: macos-latest
    continue-on-error: true          # nuovo: informativo finché non è stabile sui runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build segvault-server and run the engine suites
        run: |
          make -j4 server
          make test_engine test_sql test_sessions test_durability
          ./test_engine && ./test_sql && ./test_sessions && ./test_durability

  analyze:
    runs-on: ubuntu-latest
    continue-on-error: true          # informativo: non blocca le pull request
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck
      - name: cppcheck (engine and server)
        run: cppcheck --enable=warning,portability --inline-suppr --quiet -Iinclude -Isrc src/storage src/table src/tx src/bridge src/catalog src/server

  bench:
    # P3.6: gli scenari di bench/suite.c su SegVault e SQLite; fallisce se uno scenario peggiora di oltre il
    # 15 % rispetto a SQLite misurato nella stessa esecuzione (bench/baseline-quick.json). Il baseline viene
    # da un PC di sviluppo: informativo finché non se ne salva uno fatto su questi runner (artifact bench-json).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev php-cli php-mysql
      - name: Benchmark against SQLite and the baseline
        run: make -j4 lib server bench_suite && make bench-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-json
          path: build-bench/run*.json
