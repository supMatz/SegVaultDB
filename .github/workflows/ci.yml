name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash   # -eo pipefail: un errore di make non viene nascosto da tee

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxft-dev libxrender-dev libfontconfig1-dev mingw-w64

      - name: Build (Linux)
        run: make -j"$(nproc)" 2>&1 | tee build.log

      - name: No compiler warnings (Linux)
        run: "! grep -E 'warning:' build.log"

      - name: Engine tests
        run: make test

      - name: Engine tests under AddressSanitizer + UBSan
        run: make test-asan

      - name: Build (Windows, MinGW-w64)
        run: make -j"$(nproc)" windows 2>&1 | tee build-win.log

      - name: No compiler warnings (Windows)
        run: "! grep -E 'warning:' build-win.log"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: segvault-windows
          path: |
            segvault.exe
            segvault-server.exe
            assets/
